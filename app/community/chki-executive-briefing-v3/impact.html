<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Medical Universe | CHKI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body class="void-page">
  <main class="medical-void" id="medical-void" aria-label="Interactive medical universe">
    <canvas id="void-stars" aria-hidden="true"></canvas>

    <div class="void-world" id="void-world">
      <button class="void-galaxy galaxy-cardiology" data-world="cardiology" style="--x:16%;--y:24%;--size:170px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Cardiology</strong><small>Heart & blood vessels</small></span>
      </button>

      <button class="void-galaxy galaxy-neurology" data-world="neurology" style="--x:69%;--y:18%;--size:148px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Neurology</strong><small>Brain & nervous system</small></span>
      </button>

      <button class="void-galaxy galaxy-oncology" data-world="oncology" style="--x:44%;--y:50%;--size:188px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Oncology</strong><small>Cancer care & research</small></span>
      </button>

      <button class="void-galaxy galaxy-pediatrics" data-world="pediatrics" style="--x:84%;--y:65%;--size:142px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Pediatrics</strong><small>Children & adolescents</small></span>
      </button>

      <button class="void-galaxy galaxy-psychiatry" data-world="psychiatry" style="--x:20%;--y:78%;--size:154px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Psychiatry</strong><small>Mental health</small></span>
      </button>

      <button class="void-galaxy galaxy-surgery" data-world="surgery" style="--x:65%;--y:84%;--size:132px;">
        <span class="void-galaxy-core"></span>
        <span class="void-galaxy-label"><strong>Surgery</strong><small>Procedures & recovery</small></span>
      </button>
    </div>

    <button class="void-home" type="button" onclick="window.location.href='dashboard.html'" aria-label="Return to CHKI dashboard">CHKI</button>
    <button class="void-reset" id="void-reset" type="button" aria-label="Recenter universe">⌖</button>
    <div class="void-hint">Drag to roam · Scroll to travel · Select a galaxy</div>
  </main>

  <dialog class="void-dialog" id="void-dialog">
    <button class="void-dialog-close" id="void-dialog-close" aria-label="Close">×</button>
    <p>MEDICAL WORLD</p>
    <h1 id="void-dialog-title">Cardiology</h1>
    <span id="void-dialog-description">The study and treatment of the heart and blood vessels.</span>
    <div class="void-dialog-status">World under development</div>
  </dialog>

  <script src="assets/js/portal.js"></script>
</body>
</html>
